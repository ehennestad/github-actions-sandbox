name: Run tests

on:
  # Triggers the workflow on push to any branch other than main or PR to main
  # This way tests will run on any push to a feature branch and when feature 
  # branches are merged to main, but not repeated when PRs are actually merged. 
  push:
    branches-ignore: ["pipeline", "gh-badges"]
    paths-ignore:
      - '*README.md'
      - '*md'
      - '.github/**'
  pull_request:
    branches: [ "main" ]
  # Allows for manually running this workflow from the Actions tab
  workflow_dispatch:

jobs:
  run-test-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check if branch is part of a PR
        id: check-pr
        uses: actions/github-script@v6
        with:
          script: |
            const response = await github.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
            });
            return response.data.length > 0;
          result-encoding: string

      - name: Skip if part of a PR
        if: steps.check-pr.outputs.result == 'true'
        run: echo "This branch is part of an open PR. Skipping workflow."

      - name: Run if not part of a PR
        if: steps.check-pr.outputs.result == 'false'
        run: echo "This branch is not part of an open PR. Running workflow."

  run-test-on-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Workflow for PR
        run: echo "Running workflow for the pull request."

