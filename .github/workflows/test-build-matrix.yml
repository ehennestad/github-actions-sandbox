name: Test Build Matrix Action

on:
  workflow_dispatch:
    inputs:
      tools_directory:
        description: 'Directory containing MLToolboxInfo.json'
        required: false
        default: 'tools'
      needs_python:
        type: boolean
        required: false
        default: false
        description: 'Whether Python is needed for testing (controls if Python versions are included in test matrix)'
      matlab_versions:
        description: 'MATLAB versions (override detected versions from MLToolboxInfo)'
        required: false
        default: ''
      python_versions:
        description: 'JSON object mapping MATLAB versions to Python versions'
        required: false
        default: ''

jobs:
  test_build_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
      matlab_versions: ${{ steps.build_matrix.outputs.matlab_versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build test matrix
        id: build_matrix
        uses: ehennestad/matbox-actions/configure-matlab-test-matrix@v1
        with:
          tools_directory: ${{ inputs.tools_directory }}
          include_python: ${{ inputs.needs_python }}
          matlab_versions: ${{ inputs.matlab_versions }}
          python_versions: ${{ inputs.python_versions }}
          
      - name: Display results
        run: |
          echo "Generated MATLAB versions:"
          echo '${{ steps.build_matrix.outputs.matlab_versions }}' | jq '.'
          echo ""
          echo "Generated test matrix:"
          echo '${{ steps.build_matrix.outputs.matrix }}' | jq '.'
          
  test_matrix_usage:
    needs: [test_build_matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test_build_matrix.outputs.matrix) }}
    steps:
      - name: Display matrix values
        run: |
          echo "MATLAB Version: ${{ matrix.MATLABVersion }}"
          echo "Python Version: ${{ matrix.pythonVersion }}"
