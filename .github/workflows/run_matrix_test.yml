name: Run matrix test [R2021b-R2024b]

on:
  # Triggers the workflow on push to any branch other than main or PR to main
  # This way tests will run on any push to a feature branch and when feature 
  # branches are merged to main, but not repeated when PRs are actually merged. 
  push:
    branches-ignore: ["pipeline", "gh-badges"]
    paths-ignore:
      - '*README.md'
      - '*md'
      - '.github/**'
  pull_request:
    branches: [ "main" ]
  # Allows for manually running this workflow from the Actions tab
  workflow_dispatch:

env:
  TOOLBOX_NAME: "My Sandbox"

jobs:
  # This workflow contains a single job called "test"
  test:
    name: Run MATLAB tests (release matrix)
    needs: [validate_version, configure_test_matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        MATLABVersion: [R2021b, R2022b, R2023b, R2024b]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.MATLABVersion }}

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Run tests
        uses: matlab-actions/run-command@v2
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: |
            addpath(genpath( "code" ));
            ndi.cloud.authenticate("InteractionEnabled", "off")
            addpath(genpath( "tools" ));
            testToolbox(CreateBadge=false)

      # Save the contents of the report directory from each release into an artifact.
      - name: Save report directory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.MATLABVersion }}
          path: docs/reports

  release:
    name: Package toolbox and create draft release
    needs: [test]
    uses: ehennestad/matbox-actions/.github/workflows/package-toolbox-job.yml@v1
    with:
      version_number: 0.0.1
      source_directory: code
      tools_directory: tools
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
