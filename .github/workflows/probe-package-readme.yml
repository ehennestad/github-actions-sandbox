name: Probe R2026b package readme

on:
  push:
    branches: [ investigate-r2026b-package-readme ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe R2026b
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2026b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b

      - name: Run probes
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("probe"); probePackageReadme

      - name: Upload package files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-files
          path: probe-output
          retention-days: 7
