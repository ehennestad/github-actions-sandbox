name: Probe R2026b toolbox API changes

on:
  push:
    branches: [ investigate-r2026b-toolbox-api-changes ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [ R2026a, R2026b ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB ${{ matrix.release }}
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}

      - name: Run probes
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("probe"); probeToolboxApiChanges
