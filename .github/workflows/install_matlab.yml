name: Install MATLAB

on:
  workflow_dispatch:
    inputs:
      matlab_release:
        required: false
        type: string
        default: 'latest'

jobs:
  install:
    name: Install MATLAB
    runs-on: ubuntu-latest

    steps:  
      - name: Set up MATLAB (${{ inputs.matlab_release }})
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab_release }}

      - name: Check GITHUB_TOKEN
        uses: matlab-actions/run-command@v2
        if: always()
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        with:
          command: |
            fprintf('GitHub token: %s\n', getenv("GITHUB_TOKEN"))
