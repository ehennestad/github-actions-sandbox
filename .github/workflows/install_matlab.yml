name: Install MATLAB

on:
  workflow_dispatch:
    inputs:
      matlab_release:
        required: false
        type: string
        default: 'latest'

jobs:
  install:
    name: Install MATLAB
    runs-on: ubuntu-latest

    steps:  
      - name: Set up MATLAB ('latest')
        if: ${{ inputs.matlab_release == 'latest' }}
        uses: matlab-actions/setup-matlab@v2

      - name: Set up MATLAB (${{ inputs.matlab_release == 'latest' && 'unspecified' || inputs.matlab_release }}
        if: ${{ inputs.matlab_release != 'latest'  }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab_release }}
