name: Test MatBox Composite Action (update badges)

on:   
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-update-badges:
    name: Test composite action (update badges)
    runs-on: ubuntu-latest
    steps:      
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          cache: true

      - name: Install MatBox
        uses: ehennestad/matbox/.github/actions/install-matbox@v0.9

      - name: test action
        uses: ehennestad/matbox/.github/actions/update-badges@make-release-workflow-reusable
        with:
          version_number: '1.0.7'
