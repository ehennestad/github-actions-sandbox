name: Test MatBox Composite Action (update badges)

on:   
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in major.minor.patch format, i.e 0.9.x'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-update-badges:
    name: Test composite action (update badges)
    runs-on: ubuntu-latest
    steps:      
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          cache: true

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: test action
        uses: ehennestad/matbox-actions/generate-tested-with-badge@v1
        continue-on-error: true
        with:
          version_number: ${{ github.event.inputs.version }}
          tools_directory: tools
