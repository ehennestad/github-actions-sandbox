name: Analyse code

on:
  workflow_dispatch:
  
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-workflow-check-code:
    name: Run code analyser
    uses: ehennestad/matbox-actions/.github/workflows/check-code-workflow.yml@v1
    with:
      matlab_release: latest
