name: Analyse code

on:
  push:
    branches: [ "main" ]
    
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-workflow-check-code:
    name: Run code analyser
    uses: ehennestad/matbox/.github/workflows-reusable/reusable-workflow-check-code.yml@make-release-workflow-reusable
    with:
      matlab_release: latest
