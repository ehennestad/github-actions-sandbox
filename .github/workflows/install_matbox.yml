name: Install MatBox

on:
  workflow_dispatch:
    inputs:
      matlab_release:
        required: false
        type: string
        default: 'latest'

      install_mode:
        description: 'Installation mode for MatBox (release or commit)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - commit

jobs:
  install:
    name: Install MATLAB
    runs-on: ubuntu-latest

    steps:  
      - name: Set up MATLAB (${{ inputs.matlab_release }})
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab_release }}

      - name: Install MatBox
        uses: ehennestad/matbox/.github/actions/install-matbox@35569d934560c1842e0a69e1081f8d9aa644279e
        with:
          mode: 'release'

      - name: Confirm on path MatBox
        uses: matlab-actions/run-command@v2
        with:
          command: |
            which('matbox.installRequirements')