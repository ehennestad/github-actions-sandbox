name: Install MatBox

on:
  workflow_dispatch:
    inputs:
      matlab_release:
        required: false
        type: string
        default: 'latest'

      install_mode:
        description: 'Installation mode for MatBox (release or commit)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - commit

jobs:
  install:
    name: Install MATLAB
    runs-on: ubuntu-latest

    steps:
      - name: Set up MATLAB (${{ inputs.matlab_release }})
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab_release }}
          cache: true

      - name: Install MatBox
        uses: ehennestad/matbox/.github/actions/install-matbox@add-reusable-test-workflow
        with:
          mode: ${{ inputs.install_mode }}

      - name: Confirm on path MatBox
        uses: matlab-actions/run-command@v2
        with:
          command: |
            location = which('matbox.installRequirements')
            assert(~isempty(location), 'Failed to install MatBox.');

      - name: Check is secret
        uses: matlab-actions/run-command@v2
        with:
          command: |
            try
                tf = isSecret("test");
            catch ME
                disp(ME.identifier)
            end
            