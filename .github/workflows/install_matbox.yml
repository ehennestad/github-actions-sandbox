name: Install MatBox

on:
  workflow_dispatch:
    inputs:
      matlab_release:
        required: false
        type: string
        default: 'latest'

jobs:
  install:
    name: Install MATLAB
    runs-on: ubuntu-latest

    steps:  
      - name: Set up MATLAB (${{ inputs.matlab_release }})
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab_release }}

      - name: Install MatBox
        uses: "ehennestad/matbox/.github/actions/install-matbox"
        with:
          mode: 'release'

      - name: Confirm on path MatBox
        uses: matlab-actions/run-command@v2
        with:
          command: |
            which('matbox.installRequirements')