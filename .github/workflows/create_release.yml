name: Create new release

# Run workflow when a tag is created
on:
  push:
    tags: 
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in major.minor.patch format, i.e 0.9.x'
        required: true
        type: string
  
jobs:
  setup_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      version_tag: ${{ steps.set_version.outputs.version_tag }}
    steps:
      - name: Check for retag
        if: ${{ contains(github.event.head_commit.message, '[skip-ci]') }}
        run: |
          echo "Error: Commit message contains [skip-ci], skipping."
          exit 1
          
      - name: Set version based on trigger type
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # For manual trigger, use the input version
            VERSION="${{ github.event.inputs.version }}"
            # Validate format
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Input for 'version' ('$VERSION') is not in the expected major.minor.patch format."
              exit 1
            fi
            VERSION_TAG="v$VERSION"
          else
            # For tag trigger, use the tag name
            VERSION_TAG="${{ github.ref_name }}"
            # Remove 'v' prefix if present for the version number
            VERSION="${VERSION_TAG#v}"
            
            # Validate format
            if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Tag name ('$VERSION_TAG') is not in the expected v*.*.* format."
              exit 1
            fi
          fi
          
          echo "Using version: $VERSION (tag: $VERSION_TAG)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT


  codespell:
    name: Check for spelling errors
    needs: setup_version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup_version.outputs.version }}
      VERSION_TAG: ${{ needs.setup_version.outputs.version_tag }}

    steps:
      - name: Check for retag
        if: always()
        run: |
          echo "${{ github.event.head_commit.message }}"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Codespell
        uses: codespell-project/actions-codespell@v2

      # Update the version.txt file with the new tag
      - name: Update version.txt
        run: |
          echo "${{ env.VERSION_TAG }}" > version.txt
          git config user.name "${{ github.workflow }} by ${{ github.actor }}"
          git config user.email "<>"
          git add version.txt
          git commit -m "Update version.txt to ${{ env.VERSION_TAG }}"
          
          # Fetch and pull latest changes to avoid conflicts
          git fetch origin main
          git pull origin main --rebase
          
          # Push the version.txt update to main
          git push origin main
      
      # Retag the repo so that the updated files are included in the release tag
      - name: Update tag
        run: |
          git config user.name "${{ github.workflow }} by ${{ github.actor }}"
          git config user.email "<>"
          
          # Make sure we have the latest changes
          git pull origin main --rebase
          
          # Get the latest commit hash (which should include the version.txt update)
          LATEST_COMMIT=$(git rev-parse HEAD)
          echo "Latest commit is $LATEST_COMMIT"
          
          # Delete the existing tag locally and remotely
          git tag -d "${{ env.VERSION_TAG }}" || true
          git push origin --delete "${{ env.VERSION_TAG }}" || true
          
          # Recreate the tag at the latest commit with a message, including [skip ci] to prevent CI workflows
          git tag -a "${{ env.VERSION_TAG }}" -m "Release ${{ env.VERSION_TAG }} [skip-ci]" $LATEST_COMMIT
          
          # Push the new tag to the remote repository
          git push origin "${{ env.VERSION_TAG }}"
    
      # Create the release
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          tag: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          generateReleaseNotes: true
