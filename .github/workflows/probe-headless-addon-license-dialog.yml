name: Probe headless add-on license dialog

on:
  push:
    branches: [ investigate-headless-addon-license-dialog ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [ R2024b, R2025a, R2025b, R2026a, R2026b ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB ${{ matrix.release }}
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}

      - name: Report display state
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("probe-license-dialog"); reportDisplayState

      - name: Install an .mltbx add-on with agreeToLicense true
        timeout-minutes: 6
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("probe-license-dialog"); installMltbx(true)
