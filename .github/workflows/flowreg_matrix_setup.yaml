name: FlowReg set_path smoke test

on:
  workflow_dispatch:

jobs:
  set-path:
    name: MATLAB ${{ matrix.matlab-release }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        matlab-release:
          - R2023a
          - R2023b 
          - R2024a
          - R2024b      
          - R2025a
          - R2025b

    steps:
      - name: Check out FlowReg
        uses: actions/checkout@v4
        with:
          repository: FlowRegSuite/flow_registration
          path: flow_registration

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab-release }}

      - name: Run set_path
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd(fullfile(getenv("GITHUB_WORKSPACE"), "flow_registration"));
            disp(version);
            disp(computer("arch"));
            mex -setup C++;
            set_path;
            assert(exist(fullfile("core", ["level_solver." mexext]), "file") == 2, ...
                "Expected level_solver MEX file was not created.");
